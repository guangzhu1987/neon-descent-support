<p class="sub">常见问题与联系入口。</p>
<div class="card"><h2>需要登录吗？</h2><p>不需要。打开游戏后会自动开始挂机战斗。</p></div>
<div class="card"><h2>没有网络能玩吗？</h2><p>可以。游戏核心进度保存在本地，联网排行榜不可用时会自动进入本地模拟榜。</p></div>
<div class="card"><h2>如何重置进度？</h2><p>卸载并重新安装应用即可清除本地进度。</p></div>
<div class="card"><h2>如何反馈问题？</h2><p>请提交到 <a href="https://github.com/guangzhu1987/neon-descent-support/issues">GitHub Issues</a>，附上设备型号、iOS 版本和问题描述。</p></div>
